[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indoor_sar"
version = "0.1.0"
description = "Indoor search and rescue with SLAM: frontier exploration, and a 2-D stand-in to test it without a simulator"
requires-python = ">=3.10"
authors = [{ name = "Hector Lugo" }]
# indoor_sar.standin also needs drone_lab (../sim) for the A*:  pip install --no-deps -e ../sim
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["indoor_sar"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["indoor_sar", "drone_lab"]

[tool.ruff.format]
docstring-code-format = true
